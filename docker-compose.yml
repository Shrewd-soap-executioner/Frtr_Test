version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: proxy_postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: proxy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: proxy_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./back
    container_name: proxy_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://myuser:mypassword@db:5432/proxy_db
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./back
    container_name: proxy_celery
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://myuser:mypassword@db:5432/proxy_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=465
    command: celery -A tasks worker --loglevel=info
    depends_on:
      - backend
      - redis

  frontend:
    build: ./front_stage
    container_name: proxy_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./front_stage:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  postgres_data: